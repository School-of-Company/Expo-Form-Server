name: PR Title

# 제목 수정(edited)만으로 테스트 잡까지 다시 돌지 않도록 제목 검사를 따로 둔다. 필수 체크 `pr-title`이
# 병합 대기열에서도 보고되도록 merge_group에도 반응하고, 그때는 잡을 건너뛴다(건너뜀은 통과로 본다).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  merge_group:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 형식 검증
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^\[(form|survey|json|global|ci/cd)\]\ .+ ]]; then
            echo "PR 제목은 '[scope] description' 형식이어야 합니다 (scope: form/survey/json/global/ci-cd)." >&2
            echo "main으로 가는 릴리즈 PR은 'vX.Y.Z' 형식도 허용됩니다." >&2
            echo "현재 제목: $TITLE" >&2
            exit 1
          fi
