name: Deploy

# main -> prod, develop -> dev (glink.kr, team1/expo)
# prod(NODE_ENV=production)는 서버의 deploy.sh 가 재시작 전에 TypeORM 마이그레이션을 실행한다.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-form-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    env:
      SVC: form
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      REMOTE_ROOT: /srv/users/festa/2026/dev/team1/expo
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 테스트가 실패하면 업로드 전에 멈춘다.
      - name: Test
        run: pnpm run test

      - name: Build
        run: |
          pnpm run build
          pnpm prune --prod

      - name: Package
        run: tar czf release.tar.gz dist node_modules package.json

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXPO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPO_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ vars.EXPO_SSH_HOST }}
          PORT: ${{ vars.EXPO_SSH_PORT }}
          USER: ${{ vars.EXPO_SSH_USER }}
        run: |
          REL="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$PORT" release.tar.gz "$USER@$HOST:$REMOTE_ROOT/apps/$DEPLOY_ENV/$SVC/incoming/$REL.tar.gz"
          ssh -p "$PORT" "$USER@$HOST" "$REMOTE_ROOT/bin/deploy.sh $SVC $DEPLOY_ENV $REL"
