name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  # 병합 대기열(develop)에서도 필수 체크가 돌아야 대기열이 진행된다.
  merge_group:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 형식 검증
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^\[(form|survey|json|global|ci/cd)\]\ .+ ]]; then
            echo "PR 제목은 '[scope] description' 형식이어야 합니다 (scope: form/survey/json/global/ci-cd)." >&2
            echo "main으로 가는 릴리즈 PR은 'vX.Y.Z' 형식도 허용됩니다." >&2
            echo "현재 제목: $TITLE" >&2
            exit 1
          fi

  # 린트는 별도 잡으로 둔다. 브랜치 보호의 필수 체크(`lint`)로 걸려 있어서, 테스트·빌드와 따로
  # 통과 여부가 보여야 하고 한쪽이 실패해도 다른 쪽 결과를 같이 볼 수 있다.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # XO는 파일 내용 기준으로 결과를 캐시한다. 다만 다른 파일의 타입 변경은 캐시가 감지하지 못하므로
      # PR에서만 캐시를 쓰고, 병합 대기열에서는 캐시 없이 전체를 검사해 놓친 오류를 막는다.
      - name: XO 캐시
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/xo-linter
          key: xo-${{ hashFiles('pnpm-lock.yaml', 'xo.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: xo-${{ hashFiles('pnpm-lock.yaml', 'xo.config.ts', 'tsconfig.json') }}-

      - name: XO 린트
        run: pnpm run lint

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # PR에서는 바뀐 파일을 import 그래프로 따라가 영향받는 테스트만 돌린다(vitest --changed). import로 이어지지 않는
      # 변경(마이그레이션·JSON 등)은 놓칠 수 있어, 병합 대기열에서는 전체를 돌린다.
      - name: 단위 테스트
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            pnpm run test --changed "origin/$BASE_REF" --passWithNoTests
          else
            pnpm run test
          fi

      - run: pnpm run build

  # DB 통합 테스트(`*.integration-spec.ts`)는 `DATABASE_URL`이 없으면 건너뛰므로, Postgres를 띄워 따로 돌린다.
  # 각 spec이 이 접속 정보로 임시 DB를 만들고 지운다. 버전은 로컬 `docker-compose.yml`과 맞춘다.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: DB 통합 테스트
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            pnpm run test:integration --changed "origin/$BASE_REF" --passWithNoTests
          else
            pnpm run test:integration
          fi

  # e2e는 바뀐 영역에 따라 범위를 고른다. 병합 대기열과 코어 파일 변경은 Kafka까지 붙인 전체 e2e,
  # 그 밖의 앱 코드 변경은 Kafka를 가짜로 바꾼 스모크 e2e, 앱 코드 변경이 없으면 단계만 건너뛴다
  # (잡은 성공으로 끝나 필수 체크와 호환된다). Kafka는 전체 e2e일 때만 띄우려고 서비스가 아니라 단계에서 띄운다.
  e2e:
    runs-on: ubuntu-latest
    # 부팅 때 필수로 검사하는 설정. 외부 서비스는 호출하지 않으므로 형식만 맞는 가짜 값이다.
    env:
      USER_SERVICE_URL: http://localhost:1
      USER_SERVICE_INTERNAL_TOKEN: e2e-user-service-token-0123456789abcdef
      INTERNAL_TOKEN: e2e-internal-token-0123456789abcdef0123
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: e2e 범위 결정
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == "merge_group" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          core='^(src/app\.module\.ts|src/main\.ts|src/database/|src/kafka/|src/common/|package\.json|pnpm-lock\.yaml|vitest\.config\.e2e\.ts|\.github/workflows/ci\.yml)'
          if grep -qE "$core" <<< "$changed"; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(src/|test/)' <<< "$changed"; then
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          else
            echo "앱 코드 변경이 없어 e2e를 건너뜁니다."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.mode != 'skip'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - if: steps.scope.outputs.mode != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - if: steps.scope.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile

      - name: Kafka 기동
        if: steps.scope.outputs.mode == 'full'
        run: |
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.1
          for _ in $(seq 1 30); do
            docker exec kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs kafka
          exit 1

      - name: 스모크 e2e
        if: steps.scope.outputs.mode == 'smoke'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          KAFKA_BROKERS: localhost:9092
        run: pnpm run test:e2e:smoke

      - name: 전체 e2e
        if: steps.scope.outputs.mode == 'full'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          KAFKA_BROKERS: localhost:9092
          KAFKA_SURVEY_ANSWER_SUBMIT_TOPIC: survey.answer.submit
          KAFKA_SURVEY_ANSWER_RESULT_TOPIC: survey.answer.result
          KAFKA_SURVEY_ANSWER_RESULT_GROUP_ID: expo-form-server.survey-answer-result
          KAFKA_SMS_REQUESTED_TOPIC: notification.sms.requested
        run: pnpm run test:e2e

  notify-discord:
    needs: [lint, verify, integration, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림 전송
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: Expo Form CI
          content: |
            <@${{ secrets.DISCORD_USER_ID_1 }}> <@${{ secrets.DISCORD_USER_ID_2 }}>
            확인해주세요.
