name: CI

on:
  pull_request:
    branches: [develop, main]
  # 병합 대기열(develop)에서도 필수 체크가 돌아야 대기열이 진행된다.
  merge_group:

# 같은 PR에 새 push가 오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 테스트 범위를 한 곳에서 정한다.
  # - 전체: 병합 대기열, main으로 가는 PR(대기열을 거치지 않고 배포 직전이다), import 그래프로 따라갈 수 없는
  #   파일(의존성·TS/빌드/테스트 설정·마이그레이션·CI 자체)이 바뀐 PR
  # - 영향받는 것만(changed): 그 밖의 develop PR. vitest --changed로 바뀐 파일을 import하는 테스트만 돈다.
  # e2e는 앱 전체를 띄우므로 그래프로 고를 수 없어, 앱 코드(src·test)가 바뀌었는지만 본다.
  scope:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == "merge_group" || "$BASE_REF" == "main" ]]; then
            echo "tests=full" >> "$GITHUB_OUTPUT"
            echo "e2e=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          full='^(package\.json|pnpm-lock\.yaml|tsconfig[^/]*\.json|nest-cli\.json|vitest\.config[^/]*\.ts|xo\.config\.ts|src/database/migrations/|\.github/)'
          if grep -qE "$full" <<< "$changed"; then
            echo "tests=full" >> "$GITHUB_OUTPUT"
            echo "e2e=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tests=changed" >> "$GITHUB_OUTPUT"
          if grep -qE '^(src/|test/)' <<< "$changed"; then
            echo "e2e=run" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=skip" >> "$GITHUB_OUTPUT"
          fi

  # 린트는 별도 잡으로 둔다. 브랜치 보호의 필수 체크(`lint`)로 걸려 있어서, 테스트·빌드와 따로
  # 통과 여부가 보여야 하고 한쪽이 실패해도 다른 쪽 결과를 같이 볼 수 있다.
  lint:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # XO는 파일 내용 기준으로 결과를 캐시하지만 다른 파일의 타입 변경은 감지하지 못한다. 그래서 테스트도
      # 영향받는 것만 도는 PR에서만 캐시를 쓰고, 전체 검사 대상(대기열·main PR·설정 변경)은 캐시 없이 검사한다.
      - name: XO 캐시
        if: needs.scope.outputs.tests == 'changed'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/xo-linter
          key: xo-${{ hashFiles('pnpm-lock.yaml', 'xo.config.ts', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: xo-${{ hashFiles('pnpm-lock.yaml', 'xo.config.ts', 'tsconfig.json') }}-

      - name: XO 린트
        run: pnpm run lint

  verify:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 단위 테스트 영향 범위
        if: needs.scope.outputs.tests == 'changed'
        run: .github/scripts/affected-tests.sh "단위 테스트" "origin/${{ github.base_ref }}"

      - name: 단위 테스트
        env:
          TESTS: ${{ needs.scope.outputs.tests }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$TESTS" == "changed" ]]; then
            pnpm run test --changed "origin/$BASE_REF" --passWithNoTests
          else
            pnpm run test
          fi

      - run: pnpm run build

  # DB 통합 테스트(`*.integration-spec.ts`)는 `DATABASE_URL`이 없으면 건너뛰므로, Postgres를 띄워 따로 돌린다.
  # 각 spec이 이 접속 정보로 임시 DB를 만들고 지운다. 버전은 로컬 `docker-compose.yml`과 맞춘다.
  integration:
    needs: scope
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 통합 테스트 영향 범위
        if: needs.scope.outputs.tests == 'changed'
        run: .github/scripts/affected-tests.sh "통합 테스트" "origin/${{ github.base_ref }}" --config ./vitest.config.integration.ts

      - name: DB 통합 테스트
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          TESTS: ${{ needs.scope.outputs.tests }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$TESTS" == "changed" ]]; then
            pnpm run test:integration --changed "origin/$BASE_REF" --passWithNoTests
          else
            pnpm run test:integration
          fi

  # 앱 전체가 뜨는지 보는 스모크 e2e. Kafka는 테스트에서 가짜로 바꾸므로 Postgres만 띄운다.
  # 앱 코드 변경이 없으면 단계만 건너뛰어 잡은 성공으로 끝난다(필수 체크와 호환).
  e2e:
    needs: scope
    runs-on: ubuntu-latest
    # 부팅 때 필수로 검사하는 설정. 외부 서비스는 호출하지 않으므로 형식만 맞는 가짜 값이다.
    env:
      USER_SERVICE_URL: http://localhost:1
      USER_SERVICE_INTERNAL_TOKEN: e2e-user-service-token-0123456789abcdef
      INTERNAL_TOKEN: e2e-internal-token-0123456789abcdef0123
      KAFKA_BROKERS: localhost:9092
      KAFKA_SURVEY_ANSWER_SUBMIT_TOPIC: survey.answer.submit
      KAFKA_SURVEY_ANSWER_RESULT_TOPIC: survey.answer.result
      KAFKA_SURVEY_ANSWER_RESULT_GROUP_ID: expo-form-server.survey-answer-result
      KAFKA_SMS_REQUESTED_TOPIC: notification.sms.requested
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - if: needs.scope.outputs.e2e == 'run'
        uses: actions/checkout@v4

      - if: needs.scope.outputs.e2e == 'run'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - if: needs.scope.outputs.e2e == 'run'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - if: needs.scope.outputs.e2e == 'run'
        run: pnpm install --frozen-lockfile

      - name: 스모크 e2e
        if: needs.scope.outputs.e2e == 'run'
        run: pnpm run test:e2e

  # 실패했을 때만 알린다.
  notify-discord:
    needs: [lint, verify, integration, e2e]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림 전송
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: failure
          title: Expo Form CI
          content: |
            <@${{ secrets.DISCORD_USER_ID_1 }}> <@${{ secrets.DISCORD_USER_ID_2 }}>
            확인해주세요.
